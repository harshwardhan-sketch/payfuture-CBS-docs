  "/accounts/{accountId}/reports":
    "get":
      "tags":
        - "Reporting"
      "summary": "Get Account Reports"
      "description": "Download detailed reports in PDF format for a given account ID. Pass async=true to queue the report for background generation instead: the response is then 202 Accepted carrying a report-generation-id to poll, and the report is emailed when ready. Prefer async for large date ranges, which can otherwise exceed the request timeout."
      "operationId": "getAccountReport"
      "parameters":
        -
          "name": "accountId"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
        -
          "name": "request"
          "in": "query"
          "required": true
          "schema":
            "$ref": "#/components/schemas/ApiAccountPdfReportRequest"
        -
          "$ref": "#/components/parameters/X-ACCOUNT-HOLDER-ID"
      "responses":
        "400":
          "description": "Bad Request"
          "content":
            "*/*":
              "schema":
                "$ref": "#/components/schemas/ApiError"
        "200":
          "description": "OK"
          "content":
            "application/octet-stream":
              "schema":
                "type": "object"
            "application/json":
              "schema":
                "type": "object"
  "/accounts/by-number/{accountNumber}":
    "get":
      "tags":
        - "Accounts"
      "summary": "Get Account By Number"
      "description": "Retrieve account details and holder information using an account number."
      "operationId": "getAccountByNumber"
      "parameters":
        -
          "name": "accountNumber"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
        -
          "$ref": "#/components/parameters/X-ACCOUNT-HOLDER-ID"
      "responses":
        "400":
          "description": "Bad Request"
          "content":
            "*/*":
              "schema":
                "$ref": "#/components/schemas/ApiError"
        "200":
          "description": "OK"
          "content":
            "*/*":
              "schema":
                "$ref": "#/components/schemas/ApiAccountWithAccountHolder"
  "/accounts/balances":
    "get":
      "tags":
        - "Accounts"
      "summary": "Get Account Balances"
      "description": "Retrieve the balances of all accessible accounts."
      "operationId": "getBalances"
      "parameters":
        -
          "$ref": "#/components/parameters/X-ACCOUNT-HOLDER-ID"
      "responses":
        "400":
          "description": "Bad Request"
          "content":
            "*/*":
              "schema":
                "$ref": "#/components/schemas/ApiError"
        "200":
          "description": "OK"
          "content":
            "*/*":
              "schema":
                "$ref": "#/components/schemas/GetAccountBalancesResponse"
