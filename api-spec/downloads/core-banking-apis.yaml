    "ApiInternalTransferRequest":
      "type": "object"
      "description": "Request object for initiating an internal transfer between two accounts."
      "properties":
        "uniqueTransactionReference":
          "type": "string"
          "description": "The transaction's unique identifier provided by the client used for idempotency."
        "amount":
          "$ref": "#/components/schemas/ApiMoney"
          "description": "The amount and currency for the internal transfer."
        "reference":
          "type": "string"
          "description": "Client-provided reference for the transaction."
        "sourceAccountNumber":
          "type": "string"
          "description": "The source account number."
        "sourceAccountId":
          "type": "string"
          "format": "uuid"
          "description": "The unique identifier of the source account."
        "destinationAccountNumber":
          "type": "string"
          "description": "The destination account number."
        "destinationAccountId":
          "type": "string"
          "format": "uuid"
          "description": "The unique identifier of the destination account."
        "description":
          "type": "string"
          "description": "A description explaining the reason for the internal transfer."
        "transactionType":
          "type": "string"
          "description": "The type of internal transaction."
          "enum":
            - "SELF_TRANSFER"
            - "USER_TRANSFER"
      "required":
        - "amount"
        - "description"
        - "transactionType"
    "ApiBeneficiaryAccountVerificationRequest":
      "type": "object"
      "description": "Request to verify that a beneficiary account belongs to the named beneficiary."
      "properties":
        "iban":
          "type": "string"
          "description": "The beneficiary's IBAN."
          "example": "LV65ECHO0000000000004"
          "minLength": 1
        "bic":
          "type": "string"
          "description": "The BIC/SWIFT of the beneficiary's bank."
          "example": "ECHOLV20"
          "minLength": 1
        "beneficiaryName":
          "type": "string"
          "description": "The beneficiary's name as the payer knows it."
          "example": "Jan Berzins"
          "maxLength": 140
          "minLength": 1
      "required":
        - "beneficiaryName"
        - "bic"
        - "iban"
    "ApiBeneficiaryAccountVerification":
      "type": "object"
      "description": "The result of a beneficiary account verification."
      "properties":
        "id":
          "type": "string"
          "format": "uuid"
          "description": "Identifier of this verification, to be supplied as beneficiaryAccountVerificationId when creating the payout it was performed for."
        "beneficiaryAccountVerificationStatus":
          "type": "string"
          "description": "Whether the beneficiary name matches the account."
          "enum":
            - "MATCH"
            - "CLOSE_MATCH"
            - "NO_MATCH"
            - "NOT_APPLICABLE"
            - "NOT_VERIFIED"
        "matchedName":
          "type": "string"
          "description": "The account holder's actual name, returned only for a CLOSE_MATCH."
        "iban":
          "type": "string"
          "description": "The verified IBAN."
        "beneficiaryName":
          "type": "string"
          "description": "The beneficiary name that was checked."
        "createdDateTime":
          "type": "string"
          "format": "date-time"
          "description": "When the verification was performed."
