    "WalletPaymentDetails":
      "description": "Payment details for a mobile wallet payout (Easypaisa or JazzCash)."
      "properties":
        "documentId":
          "type": "string"
          "description": "Customer CNIC. A dummy value may be passed."
          "minLength": 1
        "walletNumber":
          "type": "string"
          "description": "The recipient's mobile wallet number. 11 digits, must start with 0."
          "example": "03042033868"
          "minLength": 1
          "pattern": "^0\\d{10}$"
      "required":
        - "documentId"
        - "walletNumber"
    "BankTransferPaymentDetails":
      "description": "Payment details for a PKR bank transfer payout."
      "properties":
        "accountNumber":
          "type": "string"
          "description": "IBAN — 24 alphanumeric characters, no spaces. Must start with the country code \"PK\"."
          "example": "PK36SCBL0000001123456702"
          "minLength": 1
          "pattern": "^PK[A-Za-z0-9]{22}$"
        "accountName":
          "type": "string"
          "description": "Account title as registered with the bank."
          "maxLength": 100
          "minLength": 1
        "bankCode":
          "type": "string"
          "description": "A code from the supported bank list. Only the listed banks are supported for `BANK_TRANSFER` payouts."
