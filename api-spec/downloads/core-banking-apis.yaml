"openapi": "3.1.0"
"info":
  "title": "Core Banking API's"
  "description": "These API's are available for registered clients. All API's are authenticated using Bearer JWT. In addition in order to use these API's the x-account-holder-id must be sent as a header. Value of this is provided by Support."
  "version": "2.0"
"servers":
  -
    "url": "https://secure-mtapi.payfuturefs.com/gateway"
"security":
  -
    "account-holder-id": []
    "bearerAuth": []
"paths":
  "/beneficiaries/{beneficiaryId}":
    "get":
      "tags":
        - "Beneficiary"
      "summary": "Get Beneficiary by ID"
      "description": "Retrieves a specific beneficiary using its unique identifier."
      "operationId": "getById"
      "parameters":
        -
          "name": "beneficiaryId"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
        -
          "$ref": "#/components/parameters/X-ACCOUNT-HOLDER-ID"
      "responses":
        "400":
          "description": "Bad Request"
          "content":
            "*/*":
              "schema":
                "$ref": "#/components/schemas/ApiError"
        "200":
          "description": "OK"
          "content":
            "*/*":
              "schema":
                "$ref": "#/components/schemas/ApiBeneficiary"
    "put":
      "tags":
        - "Beneficiary"
      "summary": "Update Beneficiary"
      "description": "Updates an existing beneficiary using the provided information."
      "operationId": "update"
      "parameters":
        -
          "name": "beneficiaryId"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
        -
          "$ref": "#/components/parameters/X-ACCOUNT-HOLDER-ID"
      "requestBody":
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/ApiBeneficiaryUpdate"
        "required": true
      "responses":
        "400":
          "description": "Bad Request"
          "content":
            "*/*":
              "schema":
                "$ref": "#/components/schemas/ApiError"
        "200":
          "description": "OK"
          "content":
            "*/*":
              "schema":
                "$ref": "#/components/schemas/ApiBeneficiary"
    "delete":
      "tags":
        - "Beneficiary"
      "summary": "Delete Beneficiary"
      "description": "Deletes a beneficiary by its unique identifier."
      "operationId": "delete"
      "parameters":
        -
          "name": "beneficiaryId"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
        -
          "$ref": "#/components/parameters/X-ACCOUNT-HOLDER-ID"
      "responses":
        "400":
          "description": "Bad Request"
          "content":
            "*/*":
              "schema":
                "$ref": "#/components/schemas/ApiError"
        "200":
          "description": "OK"
  "/beneficiaries/{beneficiaryId}/reject":
    "put":
      "tags":
        - "Beneficiary"
      "summary": "Reject Beneficiary"
      "description": "Reject beneficiary and mark it as deleted"
      "operationId": "reject"
      "parameters":
        -
          "name": "beneficiaryId"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
        -
          "$ref": "#/components/parameters/X-ACCOUNT-HOLDER-ID"
      "responses":
        "400":
          "description": "Bad Request"
          "content":
            "*/*":
              "schema":
                "$ref": "#/components/schemas/ApiError"
        "200":
          "description": "OK"
          "content":
            "*/*":
              "schema":
                "$ref": "#/components/schemas/ApiBeneficiary"
  "/beneficiaries/{beneficiaryId}/approve":
    "put":
      "tags":
        - "Beneficiary"
      "summary": "Approve Beneficiary"
      "description": "Approve previously created beneficiary"
      "operationId": "approve"
      "parameters":
        -
          "name": "beneficiaryId"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
        -
          "$ref": "#/components/parameters/X-ACCOUNT-HOLDER-ID"
      "responses":
        "400":
          "description": "Bad Request"
          "content":
            "*/*":
              "schema":
                "$ref": "#/components/schemas/ApiError"
        "200":
          "description": "OK"
          "content":
            "*/*":
              "schema":
                "$ref": "#/components/schemas/ApiBeneficiary"
  "/transfers/outbound":
    "post":
      "tags":
        - "Transactions"
      "summary": "Perform Outbound Transfer"
      "description": "Initiates an outbound transfer to a beneficiary."
      "operationId": "performOutboundTransfer"
      "parameters":
        -
          "$ref": "#/components/parameters/X-ACCOUNT-HOLDER-ID"
      "requestBody":
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/ApiOutboundTransferRequest"
        "required": true
      "responses":
        "400":
          "description": "Bad Request"
          "content":
            "*/*":
              "schema":
                "$ref": "#/components/schemas/ApiError"
        "200":
          "description": "OK"
          "content":
            "*/*":
              "schema":
                "$ref": "#/components/schemas/ApiTransaction"
  "/transfers/outbound-cbs":
    "post":
      "tags":
        - "Transactions"
      "summary": "Perform Outbound Transfer for INR"
      "description": "Initiates an outbound transfer without providing beneficiaryId for INR currency."
      "operationId": "performOutboundInrTransfer"
      "parameters":
        -
          "$ref": "#/components/parameters/X-ACCOUNT-HOLDER-ID"
      "requestBody":
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/ApiOutboundInrTransferRequest"
        "required": true
      "responses":
        "400":
          "description": "Bad Request"
          "content":
            "*/*":
              "schema":
                "$ref": "#/components/schemas/ApiError"
        "200":
          "description": "OK"
          "content":
            "*/*":
              "schema":
                "$ref": "#/components/schemas/ApiSimpleTransaction"
  "/transfers/outbound-cbs/pkr":
    "post":
      "tags":
        - "Transactions"
      "summary": "Perform Outbound Transfer for PKR"
      "description": "Initiates an outbound transfer without providing beneficiaryId for PKR currency, via Easypaisa, JazzCash or Bank Transfer."
      "operationId": "performOutboundPkrTransfer"
      "parameters":
        -
          "$ref": "#/components/parameters/X-ACCOUNT-HOLDER-ID"
      "requestBody":
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/ApiOutboundPkrTransferRequest"
        "required": true
      "responses":
        "400":
          "description": "Bad Request"
          "content":
            "*/*":
              "schema":
                "$ref": "#/components/schemas/ApiError"
        "200":
          "description": "OK"
          "content":
            "*/*":
              "schema":
                "$ref": "#/components/schemas/ApiSimpleTransaction"
  "/transfers/internal":
    "post":
      "tags":
        - "Transactions"
      "summary": "Perform Internal Transfer"
      "description": "Initiates an internal transfer between accounts."
      "operationId": "performInternalTransfer"
      "parameters":
        -
          "$ref": "#/components/parameters/X-ACCOUNT-HOLDER-ID"
      "requestBody":
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/ApiInternalTransferRequest"
        "required": true
      "responses":
        "400":
          "description": "Bad Request"
          "content":
            "*/*":
              "schema":
                "$ref": "#/components/schemas/ApiError"
        "200":
          "description": "OK"
          "content":
            "*/*":
              "schema":
                "$ref": "#/components/schemas/ApiTransaction"
  "/beneficiary-account-verifications":
    "post":
      "tags":
        - "Beneficiary Account Verification"
      "summary": "Verify a beneficiary account"
      "description": "Checks whether a beneficiary account belongs to the named beneficiary, and stores the result.\nThe returned id must be supplied as `beneficiaryAccountVerificationId` on the payout it was\nperformed for; it is mandatory for EUR payouts."
      "operationId": "verify"
      "parameters":
        -
          "$ref": "#/components/parameters/X-ACCOUNT-HOLDER-ID"
      "requestBody":
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/ApiBeneficiaryAccountVerificationRequest"
        "required": true
      "responses":
        "400":
          "description": "Bad Request"
          "content":
            "*/*":
              "schema":
                "$ref": "#/components/schemas/ApiError"
        "200":
          "description": "OK"
          "content":
            "*/*":
              "schema":
                "$ref": "#/components/schemas/ApiBeneficiaryAccountVerification"
  "/beneficiaries":
    "get":
      "tags":
        - "Beneficiary"
      "summary": "List Beneficiaries"
      "description": "Returns a paginated list of beneficiaries with optional filters."
      "operationId": "findAll"
      "parameters":
        -
          "name": "beneficiaryFilter"
          "in": "query"
          "required": true
          "schema":
            "$ref": "#/components/schemas/BeneficiaryFilter"
        -
          "name": "pageable"
          "in": "query"
          "required": true
          "schema":
            "$ref": "#/components/schemas/Pageable"
        -
          "$ref": "#/components/parameters/X-ACCOUNT-HOLDER-ID"
      "responses":
        "400":
          "description": "Bad Request"
          "content":
            "*/*":
              "schema":
                "$ref": "#/components/schemas/ApiError"
        "200":
          "description": "OK"
          "content":
            "*/*":
              "schema":
                "$ref": "#/components/schemas/PageApiBeneficiary"
    "post":
      "tags":
        - "Beneficiary"
      "summary": "Create Beneficiary"
      "description": "Creates a new beneficiary with the given details."
      "operationId": "create"
      "parameters":
        -
          "$ref": "#/components/parameters/X-ACCOUNT-HOLDER-ID"
      "requestBody":
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/ApiBeneficiaryCreate"
        "required": true
      "responses":
        "400":
          "description": "Bad Request"
          "content":
            "*/*":
              "schema":
                "$ref": "#/components/schemas/ApiError"
        "200":
          "description": "OK"
          "content":
            "*/*":
              "schema":
                "$ref": "#/components/schemas/ApiBeneficiary"
  "/accounts/{accountId}/reports/requests":
    "post":
      "tags":
        - "Reporting"
      "summary": "Request an account report asynchronously"
      "description": "Queues an account report for background generation and returns immediately with a report-generation-id. Poll GET /reports/requests/{reportGenerationId} for progress; once the status is COMPLETED the response carries a download link. The original requester is also emailed when the report is ready. Use this instead of the synchronous report endpoint for date ranges large enough to exceed the request timeout."
      "operationId": "requestAccountReport"
      "parameters":
        -
          "name": "accountId"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
        -
          "name": "request"
          "in": "query"
          "required": true
          "schema":
            "$ref": "#/components/schemas/ApiAccountPdfReportRequest"
        -
          "$ref": "#/components/parameters/X-ACCOUNT-HOLDER-ID"
      "responses":
        "400":
          "description": "Bad Request"
          "content":
            "*/*":
              "schema":
                "$ref": "#/components/schemas/ApiError"
        "200":
          "description": "OK"
          "content":
            "*/*":
              "schema":
                "$ref": "#/components/schemas/ApiReportGeneration"
  "/transactions":
    "get":
      "tags":
        - "Transactions"
      "summary": "List Transactions By Filter"
      "description": "Retrieves a paginated list of transactions based on filter criteria."
      "operationId": "getTransactions"
      "parameters":
        -
          "name": "transactionFilter"
          "in": "query"
          "required": true
          "schema":
            "$ref": "#/components/schemas/TransactionFilter"
        -
          "name": "pageable"
          "in": "query"
          "required": true
          "schema":
            "$ref": "#/components/schemas/Pageable"
        -
          "$ref": "#/components/parameters/X-ACCOUNT-HOLDER-ID"
      "responses":
        "400":
          "description": "Bad Request"
          "content":
            "*/*":
              "schema":
                "$ref": "#/components/schemas/ApiError"
        "200":
          "description": "OK"
          "content":
            "*/*":
              "schema":
                "$ref": "#/components/schemas/PageApiBasicTransaction"
  "/transactions/{transactionId}":
    "get":
      "tags":
        - "Transactions"
      "summary": "Get Transaction by ID"
      "description": "Fetches a specific transaction using the provided transaction ID."
      "operationId": "getTransactionById"
      "parameters":
        -
          "name": "transactionId"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
        -
          "$ref": "#/components/parameters/X-ACCOUNT-HOLDER-ID"
      "responses":
        "400":
          "description": "Bad Request"
          "content":
            "*/*":
              "schema":
                "$ref": "#/components/schemas/ApiError"
        "200":
          "description": "OK"
          "content":
            "*/*":
              "schema":
                "$ref": "#/components/schemas/ApiTransaction"
  "/transactions/ref/{reference}":
    "get":
      "tags":
        - "Transactions"
      "summary": "Get Transaction by reference"
      "description": "Fetches a specific transaction using the provided client's custom reference."
      "operationId": "getTransactionByRef"
      "parameters":
        -
          "name": "reference"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
        -
          "$ref": "#/components/parameters/X-ACCOUNT-HOLDER-ID"
      "responses":
        "400":
          "description": "Bad Request"
          "content":
            "*/*":
              "schema":
                "$ref": "#/components/schemas/ApiError"
        "200":
          "description": "OK"
          "content":
            "*/*":
              "schema":
                "$ref": "#/components/schemas/ApiTransactionStatusResponse"
  "/reports/transactions/{transactionId}/receipt":
    "get":
      "tags":
        - "Reporting"
      "summary": "Get Transaction Receipt in PDF format"
      "description": "Retrieves the PDF receipt for a specific transaction using its transaction ID. Pass async=true to queue the report for background generation instead: the response is then 202 Accepted carrying a report-generation-id to poll, and the report is emailed when ready. Prefer async for large ranges, which can otherwise exceed the request timeout."
      "operationId": "getTransactionReceiptPdf"
      "parameters":
        -
          "name": "transactionId"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
        -
          "$ref": "#/components/parameters/X-ACCOUNT-HOLDER-ID"
      "responses":
        "400":
          "description": "Bad Request"
          "content":
            "*/*":
              "schema":
                "$ref": "#/components/schemas/ApiError"
        "200":
          "description": "OK"
          "content":
            "application/octet-stream":
              "schema":
                "type": "object"
            "application/json":
              "schema":
                "type": "object"
  "/reports/transactions/pdf":
    "get":
      "tags":
        - "Reporting"
      "summary": "Get Transaction Reports in PDF format"
      "description": "Generates a PDF report of transactions based on the provided filter criteria. Pass async=true to queue the report for background generation instead: the response is then 202 Accepted carrying a report-generation-id to poll, and the report is emailed when ready. Prefer async for large ranges, which can otherwise exceed the request timeout."
      "operationId": "getTransactionReportPdf"
      "parameters":
        -
          "name": "filter"
          "in": "query"
          "required": true
          "schema":
            "$ref": "#/components/schemas/TransactionFilter"
        -
          "$ref": "#/components/parameters/X-ACCOUNT-HOLDER-ID"
      "responses":
        "400":
          "description": "Bad Request"
          "content":
            "*/*":
              "schema":
                "$ref": "#/components/schemas/ApiError"
        "200":
          "description": "OK"
          "content":
            "application/octet-stream":
              "schema":
                "type": "object"
            "application/json":
              "schema":
                "type": "object"
  "/reports/transactions/csv":
    "get":
      "tags":
        - "Reporting"
      "summary": "Get Transaction Reports in CSV format"
      "description": "Generates a CSV report of transactions based on the provided filter criteria. Optionally restrict the report to a specific set of columns; the CSV renders them in the order they are given. When omitted, all columns are included. Pass async=true to queue the report for background generation instead: the response is then 202 Accepted carrying a report-generation-id to poll, and the report is emailed when ready. Prefer async for large ranges, which can otherwise exceed the request timeout."
      "operationId": "getTransactionReportCsv"
      "parameters":
        -
          "name": "filter"
          "in": "query"
          "required": true
          "schema":
            "$ref": "#/components/schemas/TransactionFilter"
        -
          "name": "columns"
          "in": "query"
          "required": false
          "schema":
            "type": "array"
            "items":
              "type": "string"
              "enum":
                - "TRANSACTION_NUMBER"
                - "TRANSACTION_ID"
                - "TRANSACTION_DATE"
                - "FINALIZATION_DATE"
                - "TRANSACTION_AMOUNT"
                - "TRANSACTION_CURRENCY"
                - "AMOUNT_IN_BASE_CURRENCY"
                - "TRANSACTION_BASE_CURRENCY"
                - "SOURCE_FEE_AMOUNT"
                - "SOURCE_FEE_CURRENCY"
                - "DESTINATION_FEE_AMOUNT"
                - "DESTINATION_FEE_CURRENCY"
                - "TRANSACTION_TYPE"
                - "TRANSACTION_CATEGORY"
                - "TRANSACTION_SOURCE"
                - "TRANSACTION_DESTINATION"
                - "TRANSACTION_STATUS"
                - "TRANSACTION_DESCRIPTION"
                - "TRANSACTION_REFERENCE"
                - "UNIQUE_TRANSACTION_REFERENCE"
                - "RUNNING_BALANCE"
        -
          "$ref": "#/components/parameters/X-ACCOUNT-HOLDER-ID"
      "responses":
        "400":
          "description": "Bad Request"
          "content":
            "*/*":
              "schema":
                "$ref": "#/components/schemas/ApiError"
        "200":
          "description": "OK"
          "content":
            "application/octet-stream":
              "schema":
                "type": "object"
            "application/json":
              "schema":
                "type": "object"
  "/reports/requests":
    "get":
      "tags":
        - "Reporting"
      "summary": "List your requested reports"
      "description": "Returns a paginated list of the calling user's own report generation requests, newest first."
      "operationId": "getReportGenerations"
      "parameters":
        -
          "name": "pageable"
          "in": "query"
          "required": true
          "schema":
            "$ref": "#/components/schemas/Pageable"
        -
          "$ref": "#/components/parameters/X-ACCOUNT-HOLDER-ID"
      "responses":
        "400":
          "description": "Bad Request"
          "content":
            "*/*":
              "schema":
                "$ref": "#/components/schemas/ApiError"
        "200":
          "description": "OK"
          "content":
            "*/*":
              "schema":
                "$ref": "#/components/schemas/PageApiReportGeneration"
  "/reports/requests/{reportGenerationId}":
    "get":
      "tags":
        - "Reporting"
      "summary": "Get the status of a requested report"
      "description": "Returns the state of a report generation request. Only the original requester, or an admin, can see a given request. When the status is COMPLETED the response includes a link to download the report from this API."
      "operationId": "getReportGeneration"
      "parameters":
        -
          "name": "reportGenerationId"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
        -
          "$ref": "#/components/parameters/X-ACCOUNT-HOLDER-ID"
      "responses":
        "400":
          "description": "Bad Request"
          "content":
            "*/*":
              "schema":
                "$ref": "#/components/schemas/ApiError"
        "200":
          "description": "OK"
          "content":
            "*/*":
              "schema":
                "$ref": "#/components/schemas/ApiReportGeneration"
  "/reports/requests/{reportGenerationId}/download":
    "get":
      "tags":
        - "Reporting"
      "summary": "Download a completed report"
      "description": "Streams the generated report. Only the original requester, or an admin, can download a given report, and only once its status is COMPLETED."
      "operationId": "downloadReport"
      "parameters":
        -
          "name": "reportGenerationId"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
        -
          "$ref": "#/components/parameters/X-ACCOUNT-HOLDER-ID"
      "responses":
        "400":
          "description": "Bad Request"
          "content":
            "*/*":
              "schema":
                "$ref": "#/components/schemas/ApiError"
        "200":
          "description": "OK"
          "content":
            "*/*":
              "schema":
                "type": "string"
                "format": "binary"
  "/exchange-rate/v2/{source}/{destination}":
    "get":
      "tags":
        - "Transactions"
      "summary": "Get exchange rate"
      "description": "Retrieves the exchange rate between two currencies."
      "operationId": "getExchangeRateV2"
      "parameters":
        -
          "name": "source"
          "in": "path"
          "description": "Source currency code"
          "required": true
          "schema":
            "type": "string"
          "example": "USD"
        -
          "name": "destination"
          "in": "path"
          "description": "Destination currency code"
          "required": true
          "schema":
            "type": "string"
          "example": "EUR"
        -
          "$ref": "#/components/parameters/X-ACCOUNT-HOLDER-ID"
      "responses":
        "400":
          "description": "Bad Request"
          "content":
            "*/*":
              "schema":
                "$ref": "#/components/schemas/ApiError"
        "200":
          "description": "OK"
          "content":
            "*/*":
              "schema":
                "$ref": "#/components/schemas/ApiExchangeRate"
  "/beneficiary-account-verifications/{verificationId}":
    "get":
      "tags":
        - "Beneficiary Account Verification"
      "summary": "Get a beneficiary account verification"
      "description": "Retrieves a previously performed beneficiary account verification by its identifier."
      "operationId": "getById_1"
      "parameters":
        -
          "name": "verificationId"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
        -
          "$ref": "#/components/parameters/X-ACCOUNT-HOLDER-ID"
      "responses":
        "400":
          "description": "Bad Request"
          "content":
            "*/*":
              "schema":
                "$ref": "#/components/schemas/ApiError"
        "200":
          "description": "OK"
          "content":
            "*/*":
              "schema":
                "$ref": "#/components/schemas/ApiBeneficiaryAccountVerification"
  "/accounts":
    "get":
      "tags":
        - "Accounts"
      "summary": "Get Accounts (Paginated)"
      "description": "Retrieve a paginated list of accounts based on optional filters."
      "operationId": "getAccounts"
      "parameters":
        -
          "name": "accountFilter"
          "in": "query"
          "required": true
          "schema":
            "$ref": "#/components/schemas/AccountFilter"
        -
          "name": "pageable"
          "in": "query"
          "required": true
          "schema":
            "$ref": "#/components/schemas/Pageable"
        -
          "$ref": "#/components/parameters/X-ACCOUNT-HOLDER-ID"
      "responses":
        "400":
          "description": "Bad Request"
          "content":
            "*/*":
              "schema":
                "$ref": "#/components/schemas/ApiError"
        "200":
          "description": "OK"
          "content":
            "*/*":
              "schema":
                "$ref": "#/components/schemas/PageApiAccount"
  "/accounts/{accountId}":
    "get":
      "tags":
        - "Accounts"
      "summary": "Get Account By Id"
      "description": "Retrieve a specific account using its unique identifier (UUID)."
      "operationId": "getAccountById"
      "parameters":
        -
          "name": "accountId"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
        -
          "$ref": "#/components/parameters/X-ACCOUNT-HOLDER-ID"
      "responses":
        "400":
          "description": "Bad Request"
          "content":
            "*/*":
              "schema":
