    "ApiSimpleTransaction":
      "type": "object"
      "description": "Response object representing a simplified view of a transaction."
      "properties":
        "id":
          "type": "string"
          "format": "uuid"
          "description": "The unique identifier of the transaction."
        "createdDateTime":
          "type": "string"
          "format": "date-time"
          "description": "The date and time when the transaction was created."
        "transactionStatus":
          "type": "string"
          "description": "The current status of the transaction. INITIAL, PENDING_CONFIRMATION and EXPIRED are deprecated."
          "enum":
            - "CREATED"
            - "INITIAL"
            - "PENDING_CONFIRMATION"
            - "PENDING_APPROVAL"
            - "APPROVED"
            - "PROCESSING"
            - "PENDING"
            - "COMPLETED"
            - "DECLINED"
            - "FAILED"
            - "EXPIRED"
            - "CANCELLED"
        "transactionType":
          "type": "string"
          "description": "The type of transaction."
          "enum":
            - "CREDIT"
            - "DEBIT"
            - "SYSTEM_CREDIT"
            - "SYSTEM_DEBIT"
            - "PAYIN"
            - "PAYOUT"
            - "SELF_TRANSFER"
            - "USER_TRANSFER"
            - "AH_TRANSFER"
            - "RECALL"
            - "RETURN"
        "transactionCategory":
          "type": "string"
          "description": "The category of the transaction."
          "enum":
            - "OUTBOUND"
            - "INBOUND"
            - "INTERNAL"
        "transactionTypeDescription":
          "type": "string"
          "description": "A human-readable description of the transaction type."
        "accountHolderId":
          "type": "string"
          "format": "uuid"
          "description": "The unique identifier of the account holder."
        "description":
          "type": "string"
          "description": "The description of the transaction."
        "amount":
          "$ref": "#/components/schemas/ApiMoney"
          "description": "The original amount of the transaction."
        "actualAmount":
          "$ref": "#/components/schemas/ApiMoney"
          "description": "The actual processed amount."
        "feeAmount":
          "$ref": "#/components/schemas/ApiMoney"
          "description": "The fee amount charged for the transaction."
        "chargedAmount":
          "$ref": "#/components/schemas/ApiMoney"
          "description": "The total amount charged to the account."
        "errorMessage":
          "type": "string"
          "description": "Error message if the transaction failed."
        "errorCode":
          "type": "string"
          "description": "Error code if the transaction failed."
          "enum":
            - "BENEFICIARY_FILE_DOWNLOAD_FAILED"
            - "DESTINATION_IS_MISSING_FOR_TX"
            - "INVALID_TX_STATE"
            - "NO_USABLE_OPERATIONAL_ACCOUNT_FOUND"
            - "NO_VALID_ROUTE_FOUND_FOR_TX"
            - "REPORTING_ERROR"
            - "SOURCE_IS_MISSING_FOR_TX"
            - "THIRD_PARTY_REQUEST_ERROR"
            - "TRANSACTION_CONFIG_ERROR"
            - "UNABLE_TO_CREATE_TRANSACTION"
            - "INVALID_AMOUNT_TYPE"
            - "UNABLE_TO_CREATE_TRANSACTION_EXTERNAL_CALLS"
            - "UNABLE_TO_PROCESS_TRANSACTION_EXTERNAL_CALLS"
            - "UNABLE_TO_PROCESS_TRANSACTION"
            - "UNEXPECTED_CALLBACK_STATUS"
            - "UNSUPPORTED_FLOW_FOR_TX"
            - "REPORT_STORAGE_ERROR"
            - "REPORT_TYPE_NOT_SUPPORTED_ASYNC"
            - "ACCOUNT_CURRENCY_NOT_FOUND"
            - "ACCOUNT_HOLDER_NOT_FOUND"
            - "ACCOUNT_NOT_FOUND"
            - "CASE_NOT_FOUND"
            - "BENEFICIARY_ACCOUNT_VERIFICATION_NOT_FOUND"
