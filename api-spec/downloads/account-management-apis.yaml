    "ApiPermission":
      "type": "object"
      "description": "Permission returned by the permission endpoints"
      "properties":
        "id":
          "type": "string"
          "format": "uuid"
          "description": "Unique identifier of the permission"
          "example": "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        "name":
          "type": "string"
          "description": "Name of the permission"
          "example": "CREATE_USER"
        "createdDateTime":
          "type": "string"
          "format": "date-time"
          "description": "Date and time the permission was created"
          "example": "2024-05-14T10:15:30Z"
    "ApiPermissionGroup":
      "type": "object"
      "description": "Permission group (named set of permissions) returned by the permission group endpoints"
      "properties":
        "id":
          "type": "string"
          "format": "uuid"
          "description": "Unique identifier of the permission group"
          "example": "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        "name":
          "type": "string"
          "description": "Name of the permission group"
          "enum":
            - "BANK_ADMIN"
            - "BANK_USER"
            - "BANK_VIEW"
            - "BANK_CREATOR"
            - "BANK_APPROVER"
            - "CLIENT_ADMIN_ENTERPRISE"
            - "CLIENT_ADMIN_INDIVIDUAL"
            - "CLIENT_ADMIN_WITH_THIRD_PARTIES"
            - "CLIENT_STANDARD"
            - "CLIENT_CREATOR"
            - "CLIENT_APPROVER"
            - "CLIENT_VIEW"
            - "THIRD_PARTY_ACCOUNT_HOLDER_VIEW"
            - "THIRD_PARTY_ACCOUNT_HOLDER"
            - "SUPER_ADMIN"
            - "USER_DEFAULT"
          "example": "CLIENT_STANDARD"
        "description":
          "type": "string"
          "description": "Human readable description of the permission group"
          "example": "Standard client user"
        "category":
          "type": "string"
          "description": "Category of the permission group"
          "enum":
            - "BANK"
            - "CLIENT"
            - "INTERNAL"
          "example": "CLIENT"
        "userDefault":
          "type": "boolean"
          "description": "Whether this is a default permission group. Default groups are hidden from non-admin callers when listing permission groups"
          "example": false
        "createdDateTime":
          "type": "string"
          "format": "date-time"
          "description": "Date and time the permission group was created"
          "example": "2024-05-14T10:15:30Z"
        "permissions":
          "type": "array"
          "description": "Permissions contained in the permission group"
          "items":
            "$ref": "#/components/schemas/ApiPermission"
    "ApiTotp":
      "type": "object"
      "description": "Two-factor authentication (TOTP) status of a user"
      "properties":
        "enabled":
          "type": "boolean"
          "description": "Whether TOTP two-factor authentication is enabled"
          "example": true
        "url":
          "type": "string"
          "description": "otpauth:// provisioning URL (for QR code generation) containing the TOTP secret. Only populated by the TOTP setup endpoints and for the current user; sensitive"
    "ApiUserAssociation":
      "type": "object"
      "description": "Link between a user and an account holder, with the permission groups the user holds there"
      "properties":
        "accountHolderId":
          "type": "string"
          "format": "uuid"
          "description": "Identifier of the account holder"
          "example": "7c9e6679-7425-40de-944b-e07fc1f90ae7"
        "accountHolderDisplayName":
          "type": "string"
          "description": "Display name of the account holder"
          "example": "Acme Trading Ltd"
        "permissionGroups":
          "type": "array"
          "description": "Permission groups assigned to the user for this account holder"
          "items":
            "$ref": "#/components/schemas/ApiPermissionGroup"
