    "ApiAccountHolderResponse":
      "type": "object"
      "description": "Account holder details returned by the account holder and registration endpoints"
      "properties":
        "id":
          "type": "string"
          "format": "uuid"
          "description": "Unique identifier of the account holder"
          "example": "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        "accountHolderType":
          "type": "string"
          "description": "Type of account holder"
          "enum":
            - "INDIVIDUAL"
            - "BUSINESS"
            - "INTERNAL"
            - "EXTERNAL"
          "example": "BUSINESS"
        "descriptor":
          "type": "string"
          "description": "Descriptor (name) of the account holder. Used as the display name for BUSINESS and INTERNAL account holders and is mandatory for BUSINESS account holders"
          "example": "Acme Trading Ltd"
        "parentDisplayName":
          "type": "string"
          "description": "Display name of the parent account holder, if this is a sub account holder"
          "example": "Example Bank"
        "parentId":
          "type": "string"
          "format": "uuid"
          "description": "Identifier of the parent account holder, if this is a sub account holder"
          "example": "7c9e6679-7425-40de-944b-e07fc1f90ae7"
        "ownerUserId":
          "type": "string"
          "format": "uuid"
          "description": "Identifier of the user who owns the account holder"
          "example": "9b2f1c4e-8d3a-4f6b-a1e2-5c7d8e9f0a1b"
