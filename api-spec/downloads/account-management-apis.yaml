  "/oauth/token":
    "post":
      "tags":
        - "Authentication"
      "summary": "Request token (with permissions)"
      "description": "Issues a Bearer JWT. Send the credentials as HTTP Basic in the `Authorization` header:\n\n- `grant_type=client_credentials`: `Authorization: Basic <apiKey>` and no body.\n- `grant_type=password`: `Authorization: Basic <client credentials>` with `username` and `password` sent as a form-urlencoded body.\n\nIf the user has two-factor authentication enabled the current TOTP code must be sent in `X-TOTP-CODE`, otherwise the request fails with 428."
      "operationId": "getToken"
      "parameters":
        -
          "name": "Authorization"
          "in": "header"
          "description": "HTTP Basic credentials: the API key for client_credentials, or the client credentials for password"
          "required": true
          "schema":
            "type": "string"
          "example": "Basic <apiKey>"
        -
          "name": "X-TOTP-CODE"
          "in": "header"
          "description": "Current TOTP code. Required when the user has two-factor authentication enabled"
          "required": false
          "schema":
            "type": "string"
          "example": 123456
      "requestBody":
        "description": "`grant_type` is always required (it may also be sent as a query parameter). `username` and `password` are required only for grant_type=password"
        "content":
          "application/x-www-form-urlencoded":
            "schema":
              "type": "object"
              "properties":
                "grant_type":
                  "type": "string"
                  "enum":
                    - "client_credentials"
                    - "password"
                "username":
                  "type": "string"
                  "example": "jane.doe@example.com"
                "password":
                  "type": "string"
                  "format": "password"
              "required":
                - "grant_type"
      "responses":
        "400":
          "description": "Invalid Authorization header, grant type, body or credentials"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiError"
        "200":
          "description": "Token issued, including the user's associations with their permission groups and permissions. Used by the front end"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiTokenResponse"
        "401":
          "description": "Request originates from a restricted IP address"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiError"
        "403":
          "description": "Account is disabled or expired"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiError"
        "423":
          "description": "Account is locked"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiError"
        "428":
          "description": "TOTP code required (send X-TOTP-CODE)"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ApiError"
    "delete":
      "tags":
        - "Authentication"
      "summary": "Revoke token (logout)"
      "description": "Invalidates the current token of the authenticated user or API key."
      "operationId": "invalidateToken"
      "responses":
        "400":
          "description": "Bad Request"
          "content":
            "*/*":
              "schema":
                "$ref": "#/components/schemas/ApiError"
        "200":
          "description": "OK"
