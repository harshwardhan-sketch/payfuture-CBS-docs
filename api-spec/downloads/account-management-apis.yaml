    "ApiAccountHolderTemplateRequest":
      "type": "object"
      "description": "Multipart form request to create or update an account holder branding template (POST/PUT /account-holders/{accountHolderId}/templates)"
      "properties":
        "logo":
          "type": "string"
          "format": "binary"
          "description": "Logo image file"
        "themeColourHex":
          "type": "string"
          "description": "Main theme colour as a hex code"
          "example": "#0055FF"
        "displayName":
          "type": "string"
          "description": "Display name shown in branded pages"
          "example": "Acme Trading"
        "checkoutBackgroundColourHex":
          "type": "string"
          "description": "Checkout page background colour as a hex code"
          "example": "#FFFFFF"
        "checkoutLogo":
          "type": "string"
          "format": "binary"
          "description": "Optional checkout logo image file"
        "checkoutForegroundColourHex":
          "type": "string"
          "description": "Checkout page foreground colour as a hex code"
          "example": "#000000"
        "checkoutButtonColourHex":
          "type": "string"
          "description": "Checkout page button colour as a hex code"
          "example": "#0055FF"
        "checkoutTextColourHex":
          "type": "string"
          "description": "Checkout page text colour as a hex code"
          "example": "#333333"
        "checkoutBannerSource":
          "type": "string"
          "description": "Source (e.g. URL) of the banner shown on the checkout page"
        "checkoutFontReference":
          "type": "string"
          "description": "Reference to the font used on the checkout page"
          "example": "Roboto"
        "checkoutBackgroundSource":
          "type": "string"
          "description": "Source (e.g. URL) of the background shown on the checkout page"
        "kycCheckEnabled":
          "type": "boolean"
          "description": "Whether KYC checks are enabled for this template"
          "example": false
      "required":
        - "displayName"
        - "logo"
