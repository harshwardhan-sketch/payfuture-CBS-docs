    "ApiEligibleProductResponse":
      "type": "object"
      "description": "Products available for registration per account holder type (GET /registration/eligible-products)"
      "properties":
        "eligibleProducts":
          "type": "array"
          "description": "Eligible products grouped by account holder type"
          "items":
            "$ref": "#/components/schemas/EligibleProduct"
    "EligibleProduct":
      "type": "object"
      "description": "Products available for a given account holder type"
      "properties":
        "accountHolderType":
          "type": "string"
          "description": "Type of account holder"
          "enum":
            - "INDIVIDUAL"
            - "BUSINESS"
            - "INTERNAL"
            - "EXTERNAL"
          "example": "BUSINESS"
        "products":
          "type": "array"
          "description": "Products available for the account holder type"
          "items":
            "type": "string"
            "enum":
              - "BANKING"
              - "CRYPTO"
              - "PAYMENT"
          "uniqueItems": true
    "ApiInvitation":
      "type": "object"
      "description": "User invitation returned by the invitation endpoints"
      "properties":
        "id":
          "type": "string"
          "format": "uuid"
          "description": "Unique identifier of the invitation"
          "example": "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        "status":
          "type": "string"
          "description": "Current status of the invitation"
          "enum":
            - "PENDING"
            - "ACCEPTED"
            - "DECLINED"
            - "CANCELLED"
          "example": "PENDING"
        "email":
          "type": "string"
          "description": "Email address of the invited user"
          "example": "new.user@example.com"
        "createdDateTime":
          "type": "string"
          "format": "date-time"
          "description": "Date and time the invitation was created"
          "example": "2024-05-14T10:15:30Z"
        "displayName":
          "type": "string"
          "description": "Display name associated with the invitation: the invited user's name if known, otherwise the inviting account holder's name"
          "example": "Acme Trading Ltd"
