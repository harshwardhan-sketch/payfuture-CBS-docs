      "type": "object"
      "description": "Phone number. Provide either both prefix and number, or a full international phoneNumber"
      "properties":
        "prefix":
          "type": "string"
          "description": "International dialling prefix including the leading +"
          "example": "+356"
        "number":
          "type": "string"
          "description": "National phone number without the prefix"
          "example": 79123456
        "phoneNumber":
          "type": "string"
          "description": "Full international phone number (prefix followed by number)"
          "example": "+35679123456"
