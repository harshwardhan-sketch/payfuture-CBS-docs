          "type": "string"
          "format": "uuid"
    "ApiResetPasswordRequest":
      "type": "object"
      "description": "Request to reset the password of a user (POST /reset-password)"
      "properties":
        "userId":
          "type": "string"
          "format": "uuid"
          "description": "Identifier of the user whose password is reset"
          "example": "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        "sendByEmail":
          "type": "boolean"
          "description": "If true, a reset link and verification code are emailed to the user; if false, a new password is generated and returned in the response"
          "example": false
      "required":
        - "userId"
    "ApiResetPasswordResponse":
      "type": "object"
      "description": "Result of a password reset (POST /reset-password)"
      "properties":
        "userId":
          "type": "string"
          "format": "uuid"
          "description": "Identifier of the user whose password was reset"
          "example": "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        "newPassword":
          "type": "string"
          "description": "Newly generated plain-text password, when the password was not reset by email. Sensitive; handle securely"
      "required":
        - "newPassword"
        - "userId"
    "ApiRegisterAccountHolderRequest":
      "type": "object"
      "description": "Self-registration request for a new account holder under a parent that allows registration (POST /registration/account-holders). Either userId or userDetail must be supplied"
      "properties":
        "accountHolderType":
          "type": "string"
          "description": "Type of account holder"
          "enum":
            - "INDIVIDUAL"
            - "BUSINESS"
            - "INTERNAL"
            - "EXTERNAL"
          "example": "BUSINESS"
        "descriptor":
          "type": "string"
