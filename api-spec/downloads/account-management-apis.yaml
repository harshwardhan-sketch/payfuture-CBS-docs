    "ApiCreateThirdPartyAccountHolderRequest":
      "type": "object"
      "description": "Request to create a third-party account holder (POST /account-holders/third-party-account-holders)"
      "properties":
        "descriptor":
          "type": "string"
          "description": "Descriptor (name) of the third-party account holder"
          "example": "Third Party Ltd"
        "email":
          "type": "string"
          "format": "email"
          "description": "Contact email address of the third-party account holder"
          "example": "contact@thirdparty.example.com"
      "required":
        - "descriptor"
        - "email"
    "ApiPermissionGroupPatch":
      "type": "object"
      "description": "Request to partially update a permission group (PATCH /permission-groups/{permissionGroupId})"
      "properties":
        "name":
          "type": "string"
          "description": "Name of the permission group"
          "enum":
            - "BANK_ADMIN"
            - "BANK_USER"
            - "BANK_VIEW"
            - "BANK_CREATOR"
            - "BANK_APPROVER"
            - "CLIENT_ADMIN_ENTERPRISE"
            - "CLIENT_ADMIN_INDIVIDUAL"
            - "CLIENT_ADMIN_WITH_THIRD_PARTIES"
            - "CLIENT_STANDARD"
            - "CLIENT_CREATOR"
            - "CLIENT_APPROVER"
            - "CLIENT_VIEW"
            - "THIRD_PARTY_ACCOUNT_HOLDER_VIEW"
            - "THIRD_PARTY_ACCOUNT_HOLDER"
            - "SUPER_ADMIN"
            - "USER_DEFAULT"
          "example": "CLIENT_STANDARD"
        "description":
          "type": "string"
          "description": "Human readable description of the permission group"
          "example": "Standard client user"
        "category":
          "type": "string"
          "description": "Category of the permission group"
          "enum":
            - "BANK"
            - "CLIENT"
            - "INTERNAL"
          "example": "CLIENT"
        "userDefault":
          "type": "boolean"
          "description": "Whether this is a default permission group. Default groups are hidden from non-admin callers when listing permission groups"
          "example": false
        "requiredPermission":
          "type": "string"
          "description": "Permission the caller must hold to see and assign this permission group (non-admin callers only)"
          "example": "CREATE_USER"
        "permissions":
          "type": "array"
          "description": "Identifiers of the permissions the permission group should contain"
          "items":
            "type": "string"
            "format": "uuid"
          "uniqueItems": true
    "ApiKeyDescriptionUpdate":
      "type": "object"
      "description": "Request to update the description of an API key (PATCH /api-keys/{apiKeyId})"
      "properties":
        "description":
          "type": "string"
          "description": "New description of the API key (3 to 100 characters)"
          "example": "Payments integration key"
      "required":
        - "description"
    "ApiKeySummary":
      "type": "object"
      "description": "Summary of an API key returned by the API key endpoints (secrets are never included)"
      "properties":
        "id":
          "type": "string"
          "format": "uuid"
          "description": "Unique identifier of the API key"
          "example": "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        "status":
          "type": "string"
          "description": "Current status of the API key"
          "enum":
            - "PENDING_INVITATION"
            - "PENDING"
            - "ACTIVE"
            - "EXPIRED"
            - "DORMANT"
            - "LOCKED"
            - "SUSPENDED"
          "example": "ACTIVE"
        "createdDateTime":
          "type": "string"
          "format": "date-time"
          "description": "Date and time the API key was created"
          "example": "2024-05-14T10:15:30Z"
        "description":
          "type": "string"
          "description": "Description of the API key"
          "example": "Payments integration key"
