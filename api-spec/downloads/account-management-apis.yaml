          "example": "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        "displayName":
          "type": "string"
          "description": "Display name shown in branded pages"
          "example": "Acme Trading"
        "checkoutBackgroundColourHex":
          "type": "string"
          "description": "Checkout page background colour as a hex code"
          "example": "#FFFFFF"
        "checkoutLogoUrl":
          "type": "string"
          "description": "URL of the uploaded checkout logo, if any"
          "example": "https://cdn.example.com/3fa85f64-5717-4562-b3fc-2c963f66afa6/checkoutlogo.png"
        "checkoutForegroundColourHex":
          "type": "string"
          "description": "Checkout page foreground colour as a hex code"
          "example": "#000000"
        "checkoutButtonColourHex":
          "type": "string"
          "description": "Checkout page button colour as a hex code"
          "example": "#0055FF"
        "checkoutTextColourHex":
          "type": "string"
          "description": "Checkout page text colour as a hex code"
          "example": "#333333"
        "checkoutBannerSource":
          "type": "string"
          "description": "Source (e.g. URL) of the banner shown on the checkout page"
        "checkoutFontReference":
          "type": "string"
          "description": "Reference to the font used on the checkout page"
          "example": "Roboto"
        "allowRegistration":
          "type": "boolean"
          "description": "Whether registration is allowed through this template"
