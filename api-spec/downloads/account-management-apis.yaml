      "type": "object"
      "properties":
        "id":
          "type": "string"
          "format": "uuid"
        "permissionGroups":
          "type": "array"
          "items":
            "type": "string"
          "uniqueItems": true
        "permissions":
          "type": "array"
          "items":
            "type": "string"
          "uniqueItems": true
        "accountHolderType":
          "type": "string"
          "enum":
            - "INDIVIDUAL"
            - "BUSINESS"
            - "INTERNAL"
            - "EXTERNAL"
