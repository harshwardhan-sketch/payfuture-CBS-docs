    "ApiPermissionGroupUpdate":
      "type": "object"
      "description": "Request to fully update a permission group (PUT /permission-groups/{permissionGroupId})"
      "properties":
        "name":
          "type": "string"
          "description": "Name of the permission group"
          "enum":
            - "BANK_ADMIN"
            - "BANK_USER"
            - "BANK_VIEW"
            - "BANK_CREATOR"
            - "BANK_APPROVER"
            - "CLIENT_ADMIN_ENTERPRISE"
            - "CLIENT_ADMIN_INDIVIDUAL"
            - "CLIENT_ADMIN_WITH_THIRD_PARTIES"
            - "CLIENT_STANDARD"
            - "CLIENT_CREATOR"
            - "CLIENT_APPROVER"
            - "CLIENT_VIEW"
            - "THIRD_PARTY_ACCOUNT_HOLDER_VIEW"
            - "THIRD_PARTY_ACCOUNT_HOLDER"
            - "SUPER_ADMIN"
            - "USER_DEFAULT"
          "example": "CLIENT_STANDARD"
        "description":
          "type": "string"
          "description": "Human readable description of the permission group"
          "example": "Standard client user"
        "category":
          "type": "string"
          "description": "Category of the permission group"
          "enum":
            - "BANK"
            - "CLIENT"
            - "INTERNAL"
          "example": "CLIENT"
        "userDefault":
          "type": "boolean"
          "description": "Whether this is a default permission group. Default groups are hidden from non-admin callers when listing permission groups"
          "example": false
        "requiredPermission":
          "type": "string"
          "description": "Permission the caller must hold to see and assign this permission group (non-admin callers only)"
          "example": "CREATE_USER"
        "permissions":
          "type": "array"
          "description": "Identifiers of the permissions the permission group should contain"
          "items":
            "type": "string"
            "format": "uuid"
          "uniqueItems": true
      "required":
        - "category"
        - "name"
    "ApiPermissionGroupPermissionSet":
      "type": "object"
      "description": "Set of permissions to add to or remove from a permission group (PUT/DELETE /permission-groups/{permissionGroupId}/permissions)"
      "properties":
        "permissions":
          "type": "array"
          "description": "Identifiers of the permissions to add or remove (at least one)"
          "items":
            "type": "string"
            "format": "uuid"
          "uniqueItems": true
      "required":
        - "permissions"
    "ApiTotpRequest":
      "type": "object"
      "description": "Request to activate TOTP two-factor authentication for the current user (PUT /me/totp)"
      "properties":
        "totpCode":
          "type": "string"
          "description": "Current TOTP code from the authenticator app"
          "example": 123456
      "required":
        - "totpCode"
    "ApiChangePasswordRequest":
      "type": "object"
      "description": "Request to change the password of the currently authenticated user (PUT /me/password)"
      "properties":
        "oldPassword":
          "type": "string"
          "description": "Current password of the user"
        "newPassword":
          "type": "string"
          "description": "New password. Must contain at least one upper-case letter, one lower-case letter, one digit and one special character, and no whitespace"
      "required":
        - "newPassword"
        - "oldPassword"
    "ApiAccountHolderUpdate":
      "type": "object"
      "description": "Request to update an existing account holder (PUT /account-holders/{accountHolderId})"
      "properties":
        "accountHolderType":
          "type": "string"
          "description": "Type of account holder"
          "enum":
            - "INDIVIDUAL"
            - "BUSINESS"
            - "INTERNAL"
            - "EXTERNAL"
          "example": "BUSINESS"
        "accountHolderStatus":
          "type": "string"
          "description": "New status of the account holder"
          "enum":
            - "PENDING"
            - "ACTIVE"
            - "SUSPENDED"
            - "DORMANT"
            - "PENDING_KYC"
            - "KYC_REQUIRED"
            - "KYC_COMPLETED"
          "example": "ACTIVE"
        "descriptor":
          "type": "string"
          "description": "Descriptor (name) of the account holder. Used as the display name for BUSINESS and INTERNAL account holders and is mandatory for BUSINESS account holders"
          "example": "Acme Trading Ltd"
        "domain":
          "type": "string"
          "description": "Custom web domain associated with the account holder, used for branding emails and links"
          "example": "portal.example.com"
        "senderEmail":
          "type": "string"
          "description": "Sender email address used for emails branded for this account holder"
