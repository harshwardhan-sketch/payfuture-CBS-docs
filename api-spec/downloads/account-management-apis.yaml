"openapi": "3.1.0"
"info":
  "title": "Account Management API's"
  "description": "These API's are available for registered clients. All API's are authenticated using OAuth2 for which details will be provided by Support. In addition in order to use these API's the x-account-holder-id must be sent as a header. Value of this is provided by Support."
  "version": "1.0.0"
"servers":
  -
    "url": "https://secure-mtapi.payfuturefs.com/auth"
"tags":
  -
    "name": "Authentication"
    "description": "Obtaining access tokens"
"paths":
  "/users/{userId}":
    "get":
      "tags":
        - "Users"
      "summary": "Get user by ID"
      "description": "Returns a single user including associations."
      "operationId": "getUserById"
      "parameters":
        -
          "name": "userId"
          "in": "path"
          "description": "User ID"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
      "responses":
        "400":
          "description": "Bad Request"
          "content":
            "*/*":
              "schema":
                "$ref": "#/components/schemas/ApiError"
        "200":
          "description": "OK"
          "content":
            "*/*":
              "schema":
                "$ref": "#/components/schemas/ApiUserResponse"
    "put":
      "tags":
        - "Users"
      "summary": "Update user"
      "description": "Updates the details of a user."
      "operationId": "updateUser"
      "parameters":
        -
          "name": "userId"
          "in": "path"
          "description": "User ID"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
      "requestBody":
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/ApiUser"
        "required": true
      "responses":
        "400":
          "description": "Bad Request"
          "content":
            "*/*":
              "schema":
                "$ref": "#/components/schemas/ApiError"
        "200":
          "description": "OK"
          "content":
            "*/*":
              "schema":
                "$ref": "#/components/schemas/ApiUserResponse"
  "/permission-groups/{permissionGroupId}":
    "get":
      "tags":
        - "Permissions"
      "summary": "Get permission group by id"
      "description": "Returns a single permission group including its permissions."
      "operationId": "getPermissionGroupsById"
      "parameters":
        -
          "name": "permissionGroupId"
          "in": "path"
          "description": "Permission group ID"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
      "responses":
        "400":
          "description": "Bad Request"
          "content":
            "*/*":
              "schema":
                "$ref": "#/components/schemas/ApiError"
        "200":
          "description": "OK"
          "content":
            "*/*":
              "schema":
                "$ref": "#/components/schemas/ApiPermissionGroup"
    "put":
      "tags":
        - "Permissions"
      "summary": "Replace permission group"
      "description": "Full update of a permission group's fields. When `permissions` is non-empty it replaces the group's permissions, otherwise the existing permissions are kept."
      "operationId": "updatePermissionGroup"
      "parameters":
        -
          "name": "permissionGroupId"
          "in": "path"
          "description": "Permission group ID"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
      "requestBody":
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/ApiPermissionGroupUpdate"
        "required": true
      "responses":
        "400":
          "description": "Bad Request"
          "content":
            "*/*":
              "schema":
                "$ref": "#/components/schemas/ApiError"
        "200":
          "description": "OK"
          "content":
            "*/*":
              "schema":
                "$ref": "#/components/schemas/ApiPermissionGroup"
    "patch":
      "tags":
        - "Permissions"
      "summary": "Update permission group"
      "description": "Partial update of a permission group. When `permissions` is non-empty it replaces the group's permissions, otherwise the existing permissions are kept."
      "operationId": "patchPermissionGroup"
      "parameters":
        -
          "name": "permissionGroupId"
          "in": "path"
          "description": "Permission group ID"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
      "requestBody":
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/ApiPermissionGroupPatch"
        "required": true
      "responses":
        "400":
          "description": "Bad Request"
          "content":
            "*/*":
              "schema":
                "$ref": "#/components/schemas/ApiError"
        "200":
          "description": "OK"
          "content":
            "*/*":
              "schema":
                "$ref": "#/components/schemas/ApiPermissionGroup"
  "/permission-groups/{permissionGroupId}/permissions":
    "put":
      "tags":
        - "Permissions"
      "summary": "Add permissions to permission group"
      "description": "Adds the given permissions to the permission group. Unknown permission IDs are ignored."
      "operationId": "addPermissionToPermissionGroup"
      "parameters":
        -
          "name": "permissionGroupId"
          "in": "path"
          "description": "Permission group ID"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
      "requestBody":
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/ApiPermissionGroupPermissionSet"
        "required": true
      "responses":
        "400":
          "description": "Bad Request"
          "content":
            "*/*":
              "schema":
                "$ref": "#/components/schemas/ApiError"
        "200":
          "description": "OK"
          "content":
            "*/*":
              "schema":
                "$ref": "#/components/schemas/ApiPermissionGroup"
    "delete":
      "tags":
        - "Permissions"
      "summary": "Remove permissions from permission group"
      "description": "Removes the given permissions from the permission group. Unknown permission IDs are ignored."
      "operationId": "removePermissionFromPermissionGroup"
      "parameters":
        -
          "name": "permissionGroupId"
          "in": "path"
          "description": "Permission group ID"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
      "requestBody":
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/ApiPermissionGroupPermissionSet"
        "required": true
      "responses":
        "400":
          "description": "Bad Request"
          "content":
            "*/*":
              "schema":
                "$ref": "#/components/schemas/ApiError"
        "200":
          "description": "OK"
          "content":
            "*/*":
              "schema":
                "$ref": "#/components/schemas/ApiPermissionGroup"
  "/me/totp":
    "put":
      "tags":
        - "Current User"
      "summary": "Activate TOTP for the current user"
      "description": "Activates two-factor authentication for the authenticated user by validating a TOTP code from the authenticator generated with `POST /me/totp`."
      "operationId": "activateTotpForLoggedInUser"
      "requestBody":
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/ApiTotpRequest"
        "required": true
      "responses":
        "400":
          "description": "Bad Request"
          "content":
            "*/*":
              "schema":
                "$ref": "#/components/schemas/ApiError"
        "200":
          "description": "OK"
          "content":
            "*/*":
              "schema":
                "$ref": "#/components/schemas/ApiTotp"
    "post":
      "tags":
        - "Current User"
      "summary": "Generate TOTP QR code for the current user"
      "description": "Starts two-factor authentication setup by generating a TOTP secret for the authenticated user. The response contains the `otpauth://` URL to render as a QR code. 2FA is not enforced until activated with `PUT /me/totp`."
      "operationId": "generateTotpQrForLoggedInUser"
      "responses":
        "400":
          "description": "Bad Request"
          "content":
            "*/*":
              "schema":
                "$ref": "#/components/schemas/ApiError"
        "200":
          "description": "OK"
          "content":
            "*/*":
              "schema":
                "$ref": "#/components/schemas/ApiTotp"
    "delete":
      "tags":
        - "Current User"
      "summary": "Deactivate TOTP for the current user"
      "description": "Disables two-factor authentication for the authenticated user. The current TOTP code must be sent in `X-TOTP-CODE`."
      "operationId": "deactivateTotpForLoggedInUser"
      "responses":
        "400":
          "description": "Bad Request"
          "content":
            "*/*":
              "schema":
                "$ref": "#/components/schemas/ApiError"
        "200":
          "description": "OK"
  "/me/password":
    "put":
      "tags":
        - "Current User"
      "summary": "Change password for the current user"
      "description": "Changes the authenticated user's password. The current password must be provided."
      "operationId": "changePassword"
      "requestBody":
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/ApiChangePasswordRequest"
        "required": true
      "responses":
        "400":
          "description": "Bad Request"
          "content":
            "*/*":
              "schema":
                "$ref": "#/components/schemas/ApiError"
        "200":
          "description": "OK"
  "/account-holders/{accountHolderId}":
    "get":
      "tags":
        - "Account Holders"
      "summary": "Get account holder by ID"
      "description": "Returns a single account holder."
      "operationId": "getAccountHolder"
      "parameters":
        -
          "name": "accountHolderId"
          "in": "path"
          "description": "Account holder ID"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
      "responses":
        "400":
          "description": "Bad Request"
          "content":
            "*/*":
              "schema":
                "$ref": "#/components/schemas/ApiError"
        "200":
          "description": "OK"
          "content":
            "*/*":
              "schema":
                "$ref": "#/components/schemas/ApiAccountHolderResponse"
    "put":
      "tags":
        - "Account Holders"
      "summary": "Update account holder"
      "description": "Updates the properties of an account holder."
      "operationId": "updateAccountHolder"
      "parameters":
        -
          "name": "accountHolderId"
          "in": "path"
          "description": "Account holder ID"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
      "requestBody":
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/ApiAccountHolderUpdate"
        "required": true
      "responses":
        "400":
          "description": "Bad Request"
          "content":
            "*/*":
              "schema":
                "$ref": "#/components/schemas/ApiError"
        "200":
          "description": "OK"
          "content":
            "*/*":
              "schema":
                "$ref": "#/components/schemas/ApiAccountHolderResponse"
  "/account-holders/{accountHolderId}/users/{userId}":
    "put":
      "tags":
        - "Users"
      "summary": "Update permissions of a linked user"
      "description": "Replaces the permission groups of a user for the given account holder."
      "operationId": "updateLinkedUser"
      "parameters":
        -
          "name": "accountHolderId"
          "in": "path"
          "description": "Account holder ID"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
        -
          "name": "userId"
          "in": "path"
          "description": "User ID"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
      "requestBody":
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/ApiLinkedUserUpdate"
        "required": true
      "responses":
        "400":
          "description": "Bad Request"
          "content":
            "*/*":
              "schema":
                "$ref": "#/components/schemas/ApiError"
        "200":
          "description": "OK"
    "delete":
      "tags":
        - "Users"
      "summary": "Unlink a user from an account holder"
      "description": "Removes the link between a user and an account holder."
      "operationId": "deleteLinkedUser"
      "parameters":
        -
          "name": "accountHolderId"
          "in": "path"
          "description": "Account holder ID"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
        -
          "name": "userId"
          "in": "path"
          "description": "User ID"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
      "responses":
        "400":
          "description": "Bad Request"
          "content":
            "*/*":
              "schema":
                "$ref": "#/components/schemas/ApiError"
        "200":
          "description": "OK"
  "/account-holders/{accountHolderId}/templates":
    "get":
      "tags":
        - "Account Holder Templates"
      "summary": "Get account holder template by accountHolderId"
      "description": "Returns the branding template of an account holder. Unauthenticated, used by the front end before login."
      "operationId": "getAccountHolderTemplates"
      "parameters":
        -
          "name": "accountHolderId"
          "in": "path"
          "description": "Account holder ID"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
      "responses":
        "400":
          "description": "Bad Request"
          "content":
            "*/*":
              "schema":
                "$ref": "#/components/schemas/ApiError"
        "200":
          "description": "OK"
          "content":
            "*/*":
              "schema":
                "$ref": "#/components/schemas/ApiAccountHolderTemplate"
    "put":
      "tags":
        - "Account Holder Templates"
      "summary": "Update account holder template"
      "description": "Updates the branding template of an account holder. Sent as multipart form data so the logo can be uploaded."
      "operationId": "updateAccountHolderTemplate"
      "parameters":
        -
          "name": "accountHolderId"
          "in": "path"
          "description": "Account holder ID"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
      "requestBody":
        "content":
          "multipart/form-data":
            "schema":
              "$ref": "#/components/schemas/ApiAccountHolderTemplateRequest"
      "responses":
        "400":
          "description": "Bad Request"
          "content":
            "*/*":
              "schema":
                "$ref": "#/components/schemas/ApiError"
        "200":
          "description": "OK"
          "content":
            "*/*":
              "schema":
                "$ref": "#/components/schemas/ApiAccountHolderTemplate"
    "post":
      "tags":
        - "Account Holder Templates"
      "summary": "Create account holder template"
      "description": "Creates the branding template of an account holder. Sent as multipart form data so the logo can be uploaded."
      "operationId": "createAccountHolderTemplate"
      "parameters":
        -
          "name": "accountHolderId"
          "in": "path"
          "description": "Account holder ID"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
      "requestBody":
        "content":
          "multipart/form-data":
            "schema":
              "$ref": "#/components/schemas/ApiAccountHolderTemplateRequest"
      "responses":
        "400":
          "description": "Bad Request"
          "content":
            "*/*":
              "schema":
                "$ref": "#/components/schemas/ApiError"
        "200":
          "description": "OK"
          "content":
            "*/*":
              "schema":
                "$ref": "#/components/schemas/ApiAccountHolderTemplate"
  "/verification":
    "post":
      "tags":
        - "Password & Verification"
      "summary": "Request email verification"
      "description": "Starts email verification by sending a verification code to the given email address."
      "operationId": "verifyUser"
      "requestBody":
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/ApiVerificationRequest"
        "required": true
      "responses":
        "400":
          "description": "Bad Request"
          "content":
            "*/*":
              "schema":
                "$ref": "#/components/schemas/ApiError"
        "200":
          "description": "OK"
  "/verification/confirm":
    "post":
      "tags":
        - "Password & Verification"
      "summary": "Confirm email verification"
      "description": "Completes email verification by validating the code sent with `POST /verification`."
      "operationId": "verifyUserConfirmation"
      "requestBody":
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/ApiConfirmVerificationRequest"
        "required": true
      "responses":
        "400":
          "description": "Bad Request"
          "content":
            "*/*":
              "schema":
                "$ref": "#/components/schemas/ApiError"
        "200":
          "description": "OK"
  "/users":
    "get":
      "tags":
        - "Users"
      "summary": "Get users"
      "description": "Returns a paginated, filterable page of users. By default each entry is an `ApiUserSummary` (name, email, nationality and status). With `full=true` each entry is the complete `ApiUserResponse` including associations."
      "operationId": "getUsers"
      "parameters":
        -
          "name": "phoneNumber"
          "in": "query"
          "description": "Exact match on the full phone number (prefix followed by number)"
          "required": false
          "schema":
            "type": "string"
            "description": "Exact match on the full phone number (prefix followed by number)"
            "example": "+35679123456"
          "example": "+35679123456"
        -
          "name": "firstName"
          "in": "query"
          "description": "Case-insensitive match on first name (SQL LIKE pattern, % wildcards supported)"
          "required": false
          "schema":
            "type": "string"
            "description": "Case-insensitive match on first name (SQL LIKE pattern, % wildcards supported)"
            "example": "John"
          "example": "John"
        -
          "name": "lastName"
          "in": "query"
          "description": "Case-insensitive match on last name (SQL LIKE pattern, % wildcards supported)"
          "required": false
          "schema":
            "type": "string"
            "description": "Case-insensitive match on last name (SQL LIKE pattern, % wildcards supported)"
            "example": "Doe"
          "example": "Doe"
        -
          "name": "nationality"
          "in": "query"
          "description": "Filter by nationality (ISO 3166-1 alpha-2 country code)"
