    "ApiPermissionGroupCreate":
      "type": "object"
      "description": "Request to create a permission group (POST /permission-groups)"
      "properties":
        "name":
          "type": "string"
          "description": "Name of the permission group"
          "enum":
            - "BANK_ADMIN"
            - "BANK_USER"
            - "BANK_VIEW"
            - "BANK_CREATOR"
            - "BANK_APPROVER"
            - "CLIENT_ADMIN_ENTERPRISE"
            - "CLIENT_ADMIN_INDIVIDUAL"
            - "CLIENT_ADMIN_WITH_THIRD_PARTIES"
            - "CLIENT_STANDARD"
            - "CLIENT_CREATOR"
            - "CLIENT_APPROVER"
            - "CLIENT_VIEW"
            - "THIRD_PARTY_ACCOUNT_HOLDER_VIEW"
            - "THIRD_PARTY_ACCOUNT_HOLDER"
            - "SUPER_ADMIN"
            - "USER_DEFAULT"
          "example": "CLIENT_STANDARD"
        "description":
          "type": "string"
          "description": "Human readable description of the permission group"
          "example": "Standard client user"
        "category":
          "type": "string"
          "description": "Category of the permission group"
          "enum":
            - "BANK"
            - "CLIENT"
            - "INTERNAL"
          "example": "CLIENT"
        "userDefault":
          "type": "boolean"
          "description": "Whether this is a default permission group. Default groups are hidden from non-admin callers when listing permission groups"
          "example": false
        "requiredPermission":
          "type": "string"
          "description": "Permission the caller must hold to see and assign this permission group (non-admin callers only)"
          "example": "CREATE_USER"
        "permissions":
          "type": "array"
          "description": "Identifiers of the permissions to include in the permission group"
          "items":
            "type": "string"
            "format": "uuid"
          "uniqueItems": true
      "required":
        - "category"
        - "description"
        - "name"
    "ApiTokenResponse":
      "type": "object"
      "description": "Response object containing authentication token and user details"
      "properties":
        "username":
          "type": "string"
          "description": "Username of the authenticated user"
          "example": "john.doe@example.com"
        "userId":
          "type": "string"
          "format": "uuid"
          "description": "Unique identifier of the authenticated user"
          "example": "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        "associations":
          "type": "array"
          "description": "List of account holders associated with the user/API key"
          "items":
            "$ref": "#/components/schemas/TokenAccountHolderDetails"
        "userStatus":
          "type": "string"
          "description": "Current status of the user"
          "enum":
            - "PENDING_INVITATION"
            - "PENDING"
            - "ACTIVE"
            - "EXPIRED"
            - "DORMANT"
            - "LOCKED"
            - "SUSPENDED"
          "example": "ACTIVE"
        "access_token":
          "type": "string"
          "description": "JWT access token to be sent as a Bearer token on subsequent requests"
          "example": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c"
        "expires_in":
          "type": "integer"
          "format": "int64"
          "description": "Token expiration time in seconds"
          "example": 3600
    "ApiTokenSafeResponse":
      "type": "object"
      "description": "Token response for external clients (POST /oauth/gettoken). Same as the standard token response but without permissions"
      "properties":
        "username":
          "type": "string"
          "description": "Username of the authenticated user or API key"
          "example": "john.doe@example.com"
        "userId":
          "type": "string"
          "format": "uuid"
          "description": "Unique identifier of the authenticated user"
          "example": "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        "associations":
          "type": "array"
          "description": "Account holders associated with the user/API key"
          "items":
            "$ref": "#/components/schemas/TokenAccountHolderDetailsSafe"
        "access_token":
          "type": "string"
          "description": "JWT access token to be sent as a Bearer token on subsequent requests"
          "example": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        "expires_in":
          "type": "integer"
          "format": "int64"
          "description": "Token expiration time in seconds"
          "example": 3600
    "TokenAccountHolderDetailsSafe":
      "type": "object"
      "description": "Account holder associated with the token, without permission details"
      "properties":
        "id":
          "type": "string"
          "format": "uuid"
          "description": "Unique identifier of the account holder"
          "example": "7c9e6679-7425-40de-944b-e07fc1f90ae7"
        "accountHolderType":
          "type": "string"
          "description": "Type of account holder"
          "enum":
            - "INDIVIDUAL"
            - "BUSINESS"
            - "INTERNAL"
            - "EXTERNAL"
          "example": "BUSINESS"
        "status":
          "type": "string"
          "description": "Current status of the account holder"
          "enum":
            - "PENDING"
            - "ACTIVE"
            - "SUSPENDED"
            - "DORMANT"
            - "PENDING_KYC"
            - "KYC_REQUIRED"
            - "KYC_COMPLETED"
          "example": "ACTIVE"
        "displayName":
          "type": "string"
          "description": "Display name of the account holder"
          "example": "Acme Trading Ltd"
        "subAccountHolders":
          "type": "array"
          "description": "Identifiers of the sub account holders (not populated in this response)"
          "items":
            "type": "string"
            "format": "uuid"
          "uniqueItems": true
        "parentAccountHolderId":
          "type": "string"
          "format": "uuid"
          "description": "Identifier of the parent account holder, if any"
          "example": "9b2f1c4e-8d3a-4f6b-a1e2-5c7d8e9f0a1b"
        "parentAccountHolderDisplayName":
          "type": "string"
          "description": "Display name of the parent account holder, if any"
          "example": "Example Bank"
        "ownerId":
          "type": "string"
          "format": "uuid"
          "description": "Identifier of the user who owns the account holder"
          "example": "3fa85f64-5717-4562-b3fc-2c963f66afa6"
    "ApiAcceptInvitationRequest":
      "type": "object"
      "description": "Request to accept a user invitation (POST /invitations/{invitationId}/users). Either userId (existing user) or userDetail (new user registration) must be supplied"
      "properties":
        "userDetail":
          "$ref": "#/components/schemas/ApiRegisterUserRequest"
          "description": "Details of a new user to register when accepting the invitation. Ignored if userId is supplied"
        "userId":
          "type": "string"
          "format": "uuid"
          "description": "Identifier of an existing user accepting the invitation"
          "example": "3fa85f64-5717-4562-b3fc-2c963f66afa6"
    "ApiCreateInvitationRequest":
      "type": "object"
      "description": "Request to invite a user to the currently logged-in account holder (POST /invitations/users)"
      "properties":
        "email":
          "type": "string"
          "format": "email"
          "description": "Email address of the user to invite"
          "example": "new.user@example.com"
        "permissionGroupIds":
          "type": "array"
          "description": "Identifiers of the permission groups to grant the invited user (at least one)"
          "items":
            "type": "string"
            "format": "uuid"
          "uniqueItems": true
      "required":
        - "email"
        - "permissionGroupIds"
    "ApiForgotPasswordRequest":
      "type": "object"
      "description": "Request to start the forgot-password flow (POST /forgot-password); a reset link and verification code are emailed to the user"
      "properties":
        "email":
          "type": "string"
          "format": "email"
          "description": "Email address of the user who forgot the password"
          "example": "john.doe@example.com"
      "required":
        - "email"
    "ApiConfirmForgotPasswordRequest":
      "type": "object"
      "description": "Request to confirm a forgot-password or account activation flow and set a new password (POST /forgot-password/confirm)"
      "properties":
        "forgotPasswordId":
          "type": "string"
          "format": "uuid"
          "description": "Identifier of the forgot-password / activation request, as received in the emailed link"
          "example": "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        "verificationCode":
          "type": "string"
          "description": "Verification code sent to the user by email"
          "example": "0427"
        "newPassword":
          "type": "string"
          "description": "New password. Must contain at least one upper-case letter, one lower-case letter, one digit and one special character, and no whitespace"
        "activation":
          "type": "boolean"
          "description": "Set to true to confirm an account activation (the user is also set to ACTIVE); false or omitted for a forgot-password reset"
          "example": false
      "required":
        - "forgotPasswordId"
        - "newPassword"
        - "verificationCode"
    "ApiKeyRequest":
      "type": "object"
      "description": "Request to create a new API key for the current account holder (POST /api-keys)"
      "properties":
        "description":
          "type": "string"
          "description": "Description of the API key (max 100 characters)"
          "example": "Payments integration key"
        "permissionGroupIds":
          "type": "array"
          "description": "Identifiers of the permission groups to assign to the API key"
          "items":
            "type": "string"
            "format": "uuid"
        "apiKeyType":
          "type": "string"
          "description": "Type of API key. SYSTEM keys can only be managed by admins"
          "enum":
            - "SYSTEM"
            - "API"
          "example": "API"
      "required":
        - "apiKeyType"
        - "description"
    "ApiKeyResponse":
      "type": "object"
      "description": "Newly created API key (POST /api-keys). The secret values are only returned once, at creation time"
      "properties":
        "id":
          "type": "string"
          "format": "uuid"
          "description": "Unique identifier of the API key"
          "example": "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        "password":
          "type": "string"
          "description": "Generated secret of the API key. Sensitive; returned only once and must be stored securely"
        "encodedKey":
          "type": "string"
          "description": "Base64 encoded id:password value to be used as the Basic authorization credential when requesting a token. Sensitive; returned only once"
    "ApiCreateAccountHolderRequest":
      "type": "object"
      "description": "Request to create an account holder (POST /account-holders). The owner can be an invited email (userEmail), an existing user (userId), a new user (userDetail), or omitted entirely"
